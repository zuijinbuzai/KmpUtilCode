name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  jvm-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew verify --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-reports
          path: '**/build/reports/tests/'
      - uses: actions/upload-artifact@v4
        with:
          name: android-demo-debug
          path: demo-android/build/outputs/apk/debug/*.apk
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :demo-shared:compileKotlinIosArm64 :demo-shared:compileKotlinIosSimulatorArm64 --console=plain
      - run: >-
          xcodebuild -project demo-ios/KmpUtilCodeDemo.xcodeproj -scheme KmpUtilCodeDemo
          -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath demo-ios/build CODE_SIGNING_ALLOWED=NO build
